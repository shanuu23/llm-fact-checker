[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "llm_fact_checker"
version = "0.0.1"
description = "llm factchecker"
authors = [
  { name = "Group10" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "jupyterlab==4.6.1",
    "loguru",
    "matplotlib>=3.11.2",
    "mkdocs",
    "numpy>=2.5.3",
    "pandas==2.2.2",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn==1.6.1",
    "tqdm",
    "typer",
]
requires-python = "==3.12.13"


[tool.ruff]
line-length = 99
src = ["llm_fact_checker"]
include = ["pyproject.toml", "llm_fact_checker/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["llm_fact_checker"]
force-sort-within-sections = true

